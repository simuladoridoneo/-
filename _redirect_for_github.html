<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="refresh" content="15; url=https://simuladoridoneo.com">
<meta name="robots" content="noindex">
<title>El Simulador se mudó · simuladoridoneo.com</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230a1628'/%3E%3Cpath d='M20 75 L45 50 L60 65 L80 25' stroke='%23c9a84c' stroke-width='10' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#131722;--navy-mid:#1b2231;--navy-light:#2b3650;
    --gold:#f0b35a;--gold-light:#ffd089;--gold-dim:rgba(240,179,90,.14);
    --white:#eef1f7;--gray:#9aa6bc;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--navy);color:var(--white);
    font-family:'IBM Plex Sans',sans-serif;
    min-height:100vh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:1.5rem;text-align:center;
    background:radial-gradient(ellipse 80% 50% at 50% 0%, rgba(240,179,90,.05), transparent 60%), var(--navy);
  }
  .badge{
    display:inline-block;background:var(--gold-dim);border:1px solid rgba(240,179,90,.35);
    color:var(--gold);font-size:.72rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
    padding:.35rem 1rem;border-radius:20px;margin-bottom:1.6rem;font-family:'IBM Plex Mono',monospace;
  }
  h1{
    font-weight:800;font-size:clamp(1.6rem,4vw,2.4rem);line-height:1.15;margin-bottom:1rem;
  }
  h1 span{color:var(--gold);}
  p{color:var(--gray);font-size:.98rem;line-height:1.65;margin-bottom:1.2rem;max-width:520px;}
  .reassure{
    color:var(--white);font-weight:600;font-size:1rem;
    padding:.75rem 1.3rem;
    background:rgba(240,179,90,.08);
    border:1px solid rgba(240,179,90,.28);
    border-radius:12px;
    margin-bottom:1.2rem;
    display:inline-block;
  }
  .url-btn{
    display:inline-block;padding:.85rem 1.6rem;border-radius:10px;
    background:var(--gold);color:var(--navy);text-decoration:none;
    font-weight:700;font-size:1rem;margin-top:.5rem;
    transition:background .18s,transform .18s,box-shadow .18s;
    font-family:'IBM Plex Mono',monospace;
  }
  .url-btn:hover{
    background:var(--gold-light);transform:translateY(-1px);
    box-shadow:0 8px 20px rgba(240,179,90,.25);
  }
  .countdown{
    color:var(--gray);font-size:.78rem;margin-top:1.8rem;
    font-family:'IBM Plex Mono',monospace;letter-spacing:.04em;
  }
  .countdown span{color:var(--gold);font-weight:700;}
</style>
</head>
<body>
  <div class="badge">📦 El Simulador se mudó</div>
  <h1>Nueva URL:<br><span>simuladoridoneo.com</span></h1>
  <p class="reassure">¡Tranquilo/a! Todo sigue igual. Solo cambia el link.</p>
  <a class="url-btn" href="https://simuladoridoneo.com">Ir al Simulador →</a>
  <div class="countdown">Te redirigimos automáticamente en <span id="cd">15</span>s...</div>
  <script>
    let s = 15;
    const el = document.getElementById('cd');
    const tick = setInterval(() => {
      s--; if (s <= 0) { clearInterval(tick); return; }
      el.textContent = s;
    }, 1000);
  </script>
</body>
</html>
